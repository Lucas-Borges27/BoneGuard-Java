version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: boneguard-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  boneguard-service:
    build:
      context: ./boneguard-service
      dockerfile: Dockerfile
    container_name: boneguard-service
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1
      DB_USERNAME: ${DB_USERNAME:-rm00000}
      DB_PASSWORD: ${DB_PASSWORD:-senha123}
      JWT_SECRET: ${JWT_SECRET:-boneguard-super-secret-key-fiap-2024-must-be-at-least-32-chars}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://host.docker.internal:5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1
      DB_USERNAME: ${DB_USERNAME:-rm00000}
      DB_PASSWORD: ${DB_PASSWORD:-senha123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
