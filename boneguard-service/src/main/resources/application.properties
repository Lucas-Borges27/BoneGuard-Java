spring.application.name=boneguard-service
spring.main.allow-circular-references=true
server.port=8080

# =====================================================
# Oracle DataSource
# =====================================================
spring.datasource.url=${DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USERNAME:rm560027}
spring.datasource.password=${DB_PASSWORD:270304}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# =====================================================
# Flyway
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET:boneguard-super-secret-key-fiap-2024-must-be-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =====================================================
# RabbitMQ
# =====================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# =====================================================
# OpenFeign — Vision API (API Python do Bruno)
# =====================================================
vision.service.url=${VISION_SERVICE_URL:http://localhost:5000}
spring.cloud.openfeign.circuitbreaker.enabled=true

# =====================================================
# Spring AI (Groq — OpenAI-compatible, free tier)
# Crie sua chave em: https://console.groq.com
# =====================================================
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.temperature=0.7

# =====================================================
# CORS — origins do app mobile
# =====================================================
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:8081,http://localhost:19006

# =====================================================
# Swagger / OpenAPI
# =====================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# MCP Server (Model Context Protocol)
# Expõe as @Tool do BoneGuard para clientes MCP externos
# SSE endpoint: GET /mcp/sse  |  Messages: POST /mcp/message
# =====================================================
spring.ai.mcp.server.name=boneguard-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

